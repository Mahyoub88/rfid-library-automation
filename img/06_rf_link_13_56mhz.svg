<text x="272" y="700" font-size="12" fill="#5b6b7c" text-anchor="middle">modulation pause</text>
<rect x="620" y="480" width="550" height="230" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="640" y="510" font-size="16" fill="#0b7a83" font-weight="700">Uplink: tag → reader</text>
<text x="640" y="538" font-size="13.5">Load modulation: the tag switches a load on</text>
<text x="640" y="556.2" font-size="13.5">its coil, which the reader sees as a change</text>
<text x="640" y="574.5" font-size="13.5">Subcarrier 423.75 kHz (fc / 32), Manchester coded</text>
<text x="640" y="592.7" font-size="13.5">High data rate 26.48 kbit/s</text>
