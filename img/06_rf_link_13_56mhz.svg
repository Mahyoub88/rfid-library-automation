<path d="M 420 361.5 C 560 498, 700 498, 800 342" fill="none" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.5"/>
<text x="610" y="150" font-size="14" fill="#0b7a83" font-weight="700" text-anchor="middle">Magnetic near field (H-field)</text>
<rect x="810" y="200" width="170" height="180" rx="10" fill="#ffffff" stroke="#0b7a83" stroke-width="2"/>
<rect x="822" y="212" width="146" height="156" rx="6" fill="none" stroke="#0b7a83" stroke-width="1.4"/>
<rect x="834" y="224" width="122" height="132" rx="6" fill="none" stroke="#0b7a83" stroke-width="1.4"/>
<rect x="846" y="236" width="98" height="108" rx="6" fill="none" stroke="#0b7a83" stroke-width="1.4"/>
<rect x="858" y="248" width="74" height="84" rx="6" fill="none" stroke="#0b7a83" stroke-width="1.4"/>
<rect x="875" y="270" width="40" height="40" rx="3" fill="#0b7a83" stroke="#0b7a83" stroke-width="1.5"/>
<text x="895" y="295" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">IC</text>
<text x="895" y="405" font-size="13" fill="#0b7a83" font-weight="600" text-anchor="middle">Tag: coil + chip</text>
<rect x="1010" y="140" width="160" height="300" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="1024" y="166" font-size="16" fill="#0b7a83" font-weight="700">Tag chip</text>
<text x="1024" y="200" font-size="13">Rectifier → DC supply</text>
<text x="1024" y="234" font-size="13">Clock from carrier</text>
<text x="1024" y="268" font-size="13">Load-modulation</text>
<text x="1024" y="302" font-size="13">switch</text>
<text x="1024" y="336" font-size="13">Memory: UID, AFI,</text>
<text x="1024" y="370" font-size="13">user blocks</text>
<rect x="50" y="480" width="530" height="230" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="70" y="510" font-size="16" fill="#1f3a5f" font-weight="700">Downlink: reader → tag</text>
<text x="70" y="538" font-size="13.5">Amplitude-shift keying of the carrier,</text>
<text x="70" y="556.2" font-size="13.5">10 % or 100 % modulation depth</text>
<text x="70" y="574.5" font-size="13.5">Pulse-position coding: 1-of-4 (26.48 kbit/s)</text>
<text x="70" y="592.7" font-size="13.5">or 1-of-256 (1.65 kbit/s)</text>
