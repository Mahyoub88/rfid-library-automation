<line x1="280" y1="350" x2="358" y2="350" stroke="#1f3a5f" stroke-width="2"/>
<text x="385" y="410" font-size="13" fill="#1f3a5f" font-weight="600" text-anchor="middle">Reader antenna coil</text>
