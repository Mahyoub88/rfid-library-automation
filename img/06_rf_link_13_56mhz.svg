<text x="880" y="700" font-size="12" fill="#5b6b7c" text-anchor="middle">small amplitude steps at the subcarrier rate</text>
<text x="1160" y="744" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
</svg>