<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" fill="#1d2733" role="img" aria-label="The 13.56 MHz RF link">
<title>The 13.56 MHz RF link</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1d2733">The 13.56 MHz RF link</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">How a passive ISO/IEC 15693 tag is powered and how data moves each way</text>
<rect x="50" y="140" width="230" height="300" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="64" y="166" font-size="16" fill="#1f3a5f" font-weight="700">Reader</text>
<text x="66" y="200" font-size="13.5">Oscillator 13.56 MHz</text>
<text x="66" y="234" font-size="13.5">Modulator (ASK)</text>
<text x="66" y="268" font-size="13.5">Demodulator</text>
<text x="66" y="302" font-size="13.5">MCU + RS-232</text>
<text x="66" y="352" font-size="12.5" fill="#5b6b7c">Range depends on antenna</text>
<text x="66" y="370" font-size="12.5" fill="#5b6b7c">size and power: centimetres</text>
<text x="66" y="388" font-size="12.5" fill="#5b6b7c">at a pad, up to about a</text>
<text x="66" y="406" font-size="12.5" fill="#5b6b7c">metre across a gate aisle.</text>
<ellipse cx="370" cy="290" rx="16" ry="95" fill="none" stroke="#1f3a5f" stroke-width="2.4"/>
<ellipse cx="377" cy="290" rx="16" ry="95" fill="none" stroke="#1f3a5f" stroke-width="2.4"/>
