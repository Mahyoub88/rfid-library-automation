<rect width="1200" height="820" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Deployment layout in the library</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Where each RFID station sits along the patron's path (schematic, not to scale)</text>
<rect x="60" y="120" width="1080" height="640" rx="4" fill="#ffffff" stroke="#1d2733" stroke-width="3"/>
<rect x="520" y="752" width="160" height="16" fill="#ffffff"/>
