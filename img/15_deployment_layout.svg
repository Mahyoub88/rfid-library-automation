<text x="410" y="552" font-size="14" fill="#0b7a83" font-weight="700" text-anchor="middle">Staff counter</text>
<text x="410" y="572" font-size="12.5" fill="#5b6b7c" text-anchor="middle">pad reader</text>
<rect x="760" y="530" width="70" height="60" rx="6" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="795" y="565" font-size="13.5" fill="#0b7a83" font-weight="700" text-anchor="middle">K1</text>
<rect x="860" y="530" width="70" height="60" rx="6" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="895" y="565" font-size="13.5" fill="#0b7a83" font-weight="700" text-anchor="middle">K2</text>
<text x="945" y="556" font-size="14" fill="#0b7a83" font-weight="700">Self-service</text>
<text x="945" y="575" font-size="14" fill="#0b7a83" font-weight="700">kiosks</text>

<rect x="70" y="650" width="140" height="90" rx="6" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="140" y="690" font-size="14" fill="#0b7a83" font-weight="700" text-anchor="middle">Book-drop</text>
<text x="140" y="710" font-size="12.5" fill="#5b6b7c" text-anchor="middle">through the wall</text>

<g fill="#fbf1e1" stroke="#b86e00" stroke-width="1.6">
<rect x="513" y="670" width="14" height="80" rx="3"/>
<rect x="593" y="670" width="14" height="80" rx="3"/>
<rect x="673" y="670" width="14" height="80" rx="3"/>
</g>
<text x="496" y="700" font-size="14" fill="#b86e00" font-weight="700" text-anchor="end">Security gates</text>
<text x="496" y="719" font-size="12.5" fill="#5b6b7c" text-anchor="end">two aisles</text>

<g fill="none" stroke="#2e7d4f" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#m1)">
<path d="M 560 745 C 560 600, 560 520, 590 432"/>
<path d="M 650 432 C 700 480, 760 470, 790 526"/>
<path d="M 770 592 C 700 640, 640 640, 640 745"/>
</g>
<circle cx="548" cy="640" r="12" fill="#2e7d4f"/>
<circle cx="728" cy="470" r="12" fill="#2e7d4f"/>
<circle cx="672" cy="640" r="12" fill="#2e7d4f"/>
<g font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">
<text x="548" y="644.5">1</text><text x="728" y="474.5">2</text><text x="672" y="644.5">3</text>
</g>
<g font-size="13.5" fill="#2e7d4f" font-weight="600">
<text x="880" y="630">Patron path:</text>
<text x="880" y="650">1  enter through the gates</text>
<text x="880" y="670">2  browse, then borrow at a kiosk</text>
<text x="880" y="690">3  leave: gates stay quiet for</text>
<text x="896" y="710">items that were checked out</text>
</g>
<text x="1160" y="806" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
</svg>