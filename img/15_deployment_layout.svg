<path d="M 490 226 H 640" fill="none" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m0)"/>
<text x="650" y="231" font-size="13" fill="#0b7a83" font-weight="600">Handheld inventory along each aisle</text>

<rect x="70" y="140" width="190" height="280" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.5"/>
