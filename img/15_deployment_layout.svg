<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 820" width="1200" height="820" fill="#1d2733" role="img" aria-label="Deployment layout in the library">
<title>Deployment layout in the library</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}</style>
<marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
<g id="shelf">
<rect x="300" y="0" width="740" height="26" rx="2" fill="#f6f8fb" stroke="#9aa8b6" stroke-width="1.2"/>
<path d="M341 0v26M382 0v26M423 0v26M464 0v26M505 0v26M546 0v26M587 0v26M628 0v26M669 0v26M710 0v26M751 0v26M792 0v26M833 0v26M874 0v26M915 0v26M956 0v26M997 0v26" stroke="#d5dde6" stroke-width="1"/>
</g>
