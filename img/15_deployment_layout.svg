<rect x="90" y="190" width="150" height="64" rx="5" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="165" y="218" font-size="13.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Personalizer</text>
<text x="165" y="238" font-size="12" fill="#5b6b7c" text-anchor="middle">tag new items</text>
<rect x="90" y="270" width="150" height="64" rx="5" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="165" y="298" font-size="13.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">Host PC</text>
<text x="165" y="318" font-size="12" fill="#5b6b7c" text-anchor="middle">middleware + DB</text>
<text x="165" y="372" font-size="12.5" fill="#5b6b7c" text-anchor="middle">LMS link</text>
<path d="M 240 302 H 280 V 555 H 300" fill="none" stroke="#1f3a5f" stroke-width="1.4" stroke-dasharray="2 4"/>

