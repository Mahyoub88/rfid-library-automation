<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="#1d2733" role="img" aria-label="System architecture">
<title>System architecture</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="m0s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="m1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs>
<rect width="1200" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1d2733">System architecture</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Four layers: tagged items, field devices, the RFID host/middleware, and the library back end</text>
<rect x="30" y="110" width="1140" height="120" rx="10" fill="#e3f3f4" stroke="#d5dde6" stroke-width="1"/>
<text x="48" y="134" font-size="14" fill="#0b7a83" font-weight="700">Items</text>
<rect x="30" y="250" width="1140" height="200" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="48" y="274" font-size="14" fill="#0b7a83" font-weight="700">Field devices (13.56 MHz, ISO/IEC 15693)</text>
<rect x="30" y="470" width="1140" height="180" rx="10" fill="#e8eef6" stroke="#d5dde6" stroke-width="1"/>
<text x="1152" y="494" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="end">RFID host PC / middleware</text>
<rect x="30" y="700" width="1140" height="150" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="48" y="724" font-size="14" fill="#1f3a5f" font-weight="700">Library back end</text>
<text x="1152" y="134" font-size="12.5" fill="#0b7a83" font-weight="600" text-anchor="end">RF air interface: inductive coupling, no line of sight</text>
<rect x="94" y="148" width="70" height="62" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<rect x="112" y="164" width="34" height="30" rx="3" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1"/>
<circle cx="129" cy="179" r="4" fill="#0b7a83"/>
<rect x="48" y="290" width="162" height="100" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="129" y="333.3" font-size="15.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Staff counter</text>
<text x="129" y="358.2" font-size="13.5" text-anchor="middle">pad reader</text>
<line x1="129" y1="216" x2="129" y2="286" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<line x1="129" y1="392" x2="129" y2="420" stroke="#1f3a5f" stroke-width="1.6"/>
<rect x="274" y="148" width="70" height="62" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
