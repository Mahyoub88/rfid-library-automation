<rect x="228" y="290" width="162" height="100" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="309" y="333.3" font-size="15.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Self-service</text>
<text x="309" y="358.2" font-size="13.5" text-anchor="middle">kiosk</text>
<line x1="309" y1="216" x2="309" y2="286" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<line x1="309" y1="392" x2="309" y2="420" stroke="#1f3a5f" stroke-width="1.6"/>
