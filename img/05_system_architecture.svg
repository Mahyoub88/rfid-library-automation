<circle cx="489" cy="179" r="4" fill="#0b7a83"/>
<rect x="408" y="290" width="162" height="100" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="489" y="333.3" font-size="15.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Book-drop</text>
<text x="489" y="358.2" font-size="13.5" text-anchor="middle">return reader</text>
<line x1="489" y1="216" x2="489" y2="286" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<line x1="489" y1="392" x2="489" y2="420" stroke="#1f3a5f" stroke-width="1.6"/>
<rect x="634" y="148" width="70" height="62" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<rect x="652" y="164" width="34" height="30" rx="3" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1"/>
<circle cx="669" cy="179" r="4" fill="#0b7a83"/>
<rect x="588" y="290" width="162" height="100" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="669" y="333.3" font-size="15.5" fill="#b86e00" font-weight="700" text-anchor="middle">Security</text>
<text x="669" y="358.2" font-size="13.5" text-anchor="middle">gates (exit)</text>
<line x1="669" y1="216" x2="669" y2="286" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<line x1="669" y1="392" x2="669" y2="420" stroke="#1f3a5f" stroke-width="1.6"/>
<rect x="814" y="148" width="70" height="62" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<rect x="832" y="164" width="34" height="30" rx="3" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1"/>
<circle cx="849" cy="179" r="4" fill="#0b7a83"/>
<rect x="768" y="290" width="162" height="100" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="849" y="333.3" font-size="15.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Handheld</text>
<text x="849" y="358.2" font-size="13.5" text-anchor="middle">inventory wand</text>
<line x1="849" y1="216" x2="849" y2="286" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<line x1="849" y1="392" x2="849" y2="420" stroke="#1f3a5f" stroke-width="1.6"/>
<rect x="994" y="148" width="70" height="62" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<rect x="1012" y="164" width="34" height="30" rx="3" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1"/>
<circle cx="1029" cy="179" r="4" fill="#0b7a83"/>
<rect x="948" y="290" width="162" height="100" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="1029" y="333.3" font-size="15.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Personalizer</text>
<text x="1029" y="358.2" font-size="13.5" text-anchor="middle">tag programming</text>
<line x1="1029" y1="216" x2="1029" y2="286" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#m0)" marker-start="url(#m0s)"/>
<line x1="1029" y1="392" x2="1029" y2="420" stroke="#1f3a5f" stroke-width="1.6"/>
<line x1="129" y1="420" x2="1029" y2="420" stroke="#1f3a5f" stroke-width="2"/>
<rect x="400" y="428" width="525.5" height="22.5" rx="11.25" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="662.8" y="443" font-size="12.5" fill="#1f3a5f" font-weight="600" text-anchor="middle">RS-232 serial links, STX/ETX framed (USB or Ethernet on newer readers)</text>
<line x1="129" y1="420" x2="129" y2="520" stroke="#1f3a5f" stroke-width="2" marker-end="url(#m1)"/>
<rect x="48" y="524" width="255" height="108" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="62" y="550" font-size="15.5" fill="#1f3a5f" font-weight="700">Reader driver</text>
<text x="62" y="575.5" font-size="13.5">frame build/parse,</text>
<text x="62" y="593.8" font-size="13.5">checksum, retries</text>
<rect x="325" y="524" width="255" height="108" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="339" y="550" font-size="15.5" fill="#1f3a5f" font-weight="700">Tag codec</text>
<text x="339" y="575.5" font-size="13.5">item ID, AFI / EAS,</text>
<text x="339" y="593.8" font-size="13.5">block read/write</text>
<rect x="602" y="524" width="255" height="108" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="616" y="550" font-size="15.5" fill="#1f3a5f" font-weight="700">Transaction logic</text>
<text x="616" y="575.5" font-size="13.5">check-out, check-in,</text>
<text x="616" y="593.8" font-size="13.5">inventory rules</text>
<rect x="879" y="524" width="255" height="108" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="893" y="550" font-size="15.5" fill="#1f3a5f" font-weight="700">Event handler</text>
<text x="893" y="575.5" font-size="13.5">gate alarms, errors,</text>
<text x="893" y="593.8" font-size="13.5">audit log</text>
<line x1="303" y1="578" x2="325" y2="578" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#m1)"/>
<line x1="580" y1="578" x2="602" y2="578" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#m1)"/>
<line x1="857" y1="578" x2="879" y2="578" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#m1)"/>
<text x="48" y="760" font-size="13.5" fill="#5b6b7c">The middleware hides the RF detail:</text>
<text x="48" y="778.2" font-size="13.5" fill="#5b6b7c">the library system only sees</text>
<text x="48" y="796.5" font-size="13.5" fill="#5b6b7c">item IDs and circulation messages.</text>
<rect x="500" y="742" width="380" height="90" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="690" y="780.5" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="middle">Library management system</text>
<text x="690" y="805.4" font-size="13.5" text-anchor="middle">circulation, catalogue, patrons</text>
<rect x="910" y="742" width="240" height="90" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="1030" y="771.4" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="middle">Database</text>
<text x="1030" y="796.2" font-size="13.5" text-anchor="middle">items, tags, loans,</text>
<text x="1030" y="814.5" font-size="13.5" text-anchor="middle">transactions, events</text>
<line x1="729.5" y1="636" x2="729.5" y2="738" stroke="#1f3a5f" stroke-width="1.8" marker-end="url(#m1)" marker-start="url(#m1s)"/>
<text x="739.5" y="691" font-size="13" fill="#1f3a5f" font-weight="600">SIP2 / API</text>
<line x1="1006.5" y1="636" x2="1006.5" y2="738" stroke="#1f3a5f" stroke-width="1.8" marker-end="url(#m1)" marker-start="url(#m1s)"/>
<text x="1016.5" y="691" font-size="13" fill="#1f3a5f" font-weight="600">SQL</text>
<line x1="882" y1="787" x2="906" y2="787" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#m1)" marker-start="url(#m1s)"/>
<text x="40" y="872" font-size="12.5" fill="#5b6b7c">Dashed arrows: RF. Solid arrows: wired data path.</text>
<text x="1160" y="884" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
</svg>