<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="#1d2733" role="img" aria-label="ISO/IEC 15693 tag memory map">
<title>ISO/IEC 15693 tag memory map</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1d2733">ISO/IEC 15693 tag memory map</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Typical library tag (e.g. NXP ICODE SLIX class: 64-bit UID, 28 blocks × 4 bytes of user memory)</text>
<text x="40" y="130" font-size="16" fill="#0b7a83" font-weight="700">Unique identifier (UID), 64 bits, factory-locked</text>
<rect x="40" y="145" width="270" height="70" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="175" y="175" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">E0h</text>
<text x="175" y="197" font-size="12.5" text-anchor="middle">8 bits, allocation class</text>
<rect x="310" y="145" width="270" height="70" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="445" y="175" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">IC mfr code</text>
<text x="445" y="197" font-size="12.5" text-anchor="middle">8 bits, e.g. 04h = NXP</text>
<rect x="580" y="145" width="580" height="70" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="870" y="175" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">IC serial number</text>
<text x="870" y="197" font-size="12.5" text-anchor="middle">48 bits, unique per chip</text>
<text x="1160" y="130" font-size="12" fill="#5b6b7c" text-anchor="end">MSB first, segments not to scale</text>
<text x="40" y="260" font-size="16" fill="#1f3a5f" font-weight="700">System bytes</text>
<g fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5">
<rect x="40" y="275" width="270" height="95" rx="8"/>
<rect x="323" y="275" width="270" height="95" rx="8"/>
<rect x="606" y="275" width="270" height="95" rx="8"/>
<rect x="889" y="275" width="270" height="95" rx="8"/>
</g>
<g font-size="15" fill="#1f3a5f" font-weight="700">
<text x="54" y="301">AFI</text>
<text x="337" y="301">DSFID</text>
<text x="620" y="301">EAS bit</text>
<text x="903" y="301">Lock bits</text>
</g>
<g font-size="13">
<text x="54" y="325.9">Application Family Identifier,</text>
<text x="54" y="343.4">drives security state</text>
<text x="337" y="325.9">Data Storage Format ID,</text>
<text x="337" y="343.4">tells readers the data model</text>
<text x="620" y="325.9">Electronic Article Surveillance</text>
<text x="620" y="343.4">(vendor command set)</text>
<text x="903" y="325.9">per block and for AFI/DSFID,</text>
<text x="903" y="343.4">write-protect after tagging</text>
</g>
<text x="40" y="410" font-size="16" fill="#1f3a5f" font-weight="700">User memory: 28 blocks × 4 bytes = 112 bytes</text>
<g fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.2">
<rect x="40" y="425" width="75" height="32" rx="3"/>
<rect x="120" y="425" width="75" height="32" rx="3"/>
<rect x="200" y="425" width="75" height="32" rx="3"/>
<rect x="280" y="425" width="75" height="32" rx="3"/>
<rect x="360" y="425" width="75" height="32" rx="3"/>
<rect x="440" y="425" width="75" height="32" rx="3"/>
<rect x="520" y="425" width="75" height="32" rx="3"/>
<rect x="600" y="425" width="75" height="32" rx="3"/>
</g>
<g fill="#ffffff" stroke="#d5dde6" stroke-width="1.2">
<rect x="680" y="425" width="75" height="32" rx="3"/>
<rect x="760" y="425" width="75" height="32" rx="3"/>
<rect x="840" y="425" width="75" height="32" rx="3"/>
<rect x="920" y="425" width="75" height="32" rx="3"/>
<rect x="1000" y="425" width="75" height="32" rx="3"/>
<rect x="1080" y="425" width="75" height="32" rx="3"/>
<rect x="40" y="483" width="75" height="32" rx="3"/>
<rect x="120" y="483" width="75" height="32" rx="3"/>
<rect x="200" y="483" width="75" height="32" rx="3"/>
<rect x="280" y="483" width="75" height="32" rx="3"/>
<rect x="360" y="483" width="75" height="32" rx="3"/>
<rect x="440" y="483" width="75" height="32" rx="3"/>
<rect x="520" y="483" width="75" height="32" rx="3"/>
<rect x="600" y="483" width="75" height="32" rx="3"/>
<rect x="680" y="483" width="75" height="32" rx="3"/>
<rect x="760" y="483" width="75" height="32" rx="3"/>
<rect x="840" y="483" width="75" height="32" rx="3"/>
<rect x="920" y="483" width="75" height="32" rx="3"/>
<rect x="1000" y="483" width="75" height="32" rx="3"/>
<rect x="1080" y="483" width="75" height="32" rx="3"/>
</g>
<g font-size="12" font-weight="600" text-anchor="middle" fill="#1f3a5f">
<text x="77.5" y="446">Blk 0</text>
<text x="157.5" y="446">Blk 1</text>
<text x="237.5" y="446">Blk 2</text>
<text x="317.5" y="446">Blk 3</text>
<text x="397.5" y="446">Blk 4</text>
<text x="477.5" y="446">Blk 5</text>
<text x="557.5" y="446">Blk 6</text>
<text x="637.5" y="446">Blk 7</text>
</g>
<g font-size="12" font-weight="600" text-anchor="middle" fill="#5b6b7c">
<text x="717.5" y="446">Blk 8</text>
<text x="797.5" y="446">Blk 9</text>
<text x="877.5" y="446">Blk 10</text>
<text x="957.5" y="446">Blk 11</text>
<text x="1037.5" y="446">Blk 12</text>
<text x="1117.5" y="446">Blk 13</text>
<text x="77.5" y="504">Blk 14</text>
<text x="157.5" y="504">Blk 15</text>
<text x="237.5" y="504">Blk 16</text>
<text x="317.5" y="504">Blk 17</text>
<text x="397.5" y="504">Blk 18</text>
<text x="477.5" y="504">Blk 19</text>
<text x="557.5" y="504">Blk 20</text>
<text x="637.5" y="504">Blk 21</text>
<text x="717.5" y="504">Blk 22</text>
<text x="797.5" y="504">Blk 23</text>
<text x="877.5" y="504">Blk 24</text>
<text x="957.5" y="504">Blk 25</text>
<text x="1037.5" y="504">Blk 26</text>
<text x="1117.5" y="504">Blk 27</text>
</g>
<rect x="40" y="552" width="18" height="14" rx="2" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1"/>
<text x="66" y="564" font-size="13" fill="#1f3a5f" font-weight="600">Item data written by the personalizer (blocks 0–7 as an example layout)</text>
<rect x="640" y="552" width="18" height="14" rx="2" fill="#ffffff" stroke="#d5dde6" stroke-width="1"/>
<text x="666" y="564" font-size="13" fill="#5b6b7c">Free for optional ISO 28560 fields</text>
<rect x="40" y="605" width="1120" height="150" rx="10" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.2"/>
<text x="60" y="635" font-size="16" fill="#b86e00" font-weight="700">How the security state is stored (AFI convention from ISO 28560)</text>
<rect x="60" y="655" width="91.08" height="24" rx="12" fill="#ffffff" stroke="#b86e00" stroke-width="1.2"/>
<text x="105.5" y="671.5" font-size="14" fill="#b86e00" font-weight="600" text-anchor="middle">AFI = 07h</text>
<text x="185" y="673" font-size="14">item in the library, secured: gates alarm if it passes</text>
<rect x="60" y="700" width="91.08" height="24" rx="12" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.2"/>
<text x="105.5" y="716.5" font-size="14" fill="#2e7d4f" font-weight="600" text-anchor="middle">AFI = C2h</text>
<text x="185" y="718" font-size="14">item checked out, unsecured: gates stay quiet</text>
<text x="700" y="673" font-size="14" font-weight="600">Check-out writes C2h, check-in writes 07h.</text>
<text x="700" y="698" font-size="14">Some systems use the vendor EAS bit instead,</text>
<text x="700" y="718" font-size="14">or both, depending on the gate model.</text>
<text x="1160" y="784" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
</svg>