<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" fill="#1d2733" role="img" aria-label="Host to reader link over RS-232">
<title>Host ↔ reader link over RS-232</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style>
<marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Host ↔ reader link over RS-232</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">STX/ETX framing used by the library reader. The field layout is a typical pattern; exact byte values come from the vendor manual</text>
<g fill="#ffffff" stroke-width="1.8">
<rect x="50" y="140" width="110" height="80" rx="4" stroke="#1f3a5f"/>
<rect x="160" y="140" width="120" height="80" rx="4" stroke="#5b6b7c"/>
<rect x="280" y="140" width="150" height="80" rx="4" stroke="#5b6b7c"/>
<rect x="430" y="140" width="150" height="80" rx="4" stroke="#0b7a83"/>
<rect x="580" y="140" width="300" height="80" rx="4" stroke="#0b7a83"/>
<rect x="880" y="140" width="140" height="80" rx="4" stroke="#b86e00"/>
<rect x="1020" y="140" width="110" height="80" rx="4" stroke="#1f3a5f"/>
</g>
<g font-size="17" font-weight="700" text-anchor="middle">
<text x="105" y="172" fill="#1f3a5f">STX</text>
<text x="220" y="172" fill="#5b6b7c">ADDR</text>
<text x="355" y="172" fill="#5b6b7c">LEN</text>
<text x="505" y="172" fill="#0b7a83">CMD</text>
<text x="730" y="172" fill="#0b7a83">DATA</text>
<text x="950" y="172" fill="#b86e00">BCC</text>
<text x="1075" y="172" fill="#1f3a5f">ETX</text>
</g>
<g font-size="13.5" text-anchor="middle" class="m">
<text x="105" y="198" class="m">02h</text>
<text x="220" y="198" class="m">1 byte</text>
<text x="355" y="198" class="m">1 byte</text>
<text x="505" y="198" class="m">1 byte</text>
<text x="730" y="198" class="m">0…n bytes</text>
<text x="950" y="198" class="m">1 byte</text>
<text x="1075" y="198" class="m">03h</text>
</g>
<g font-size="12.5" fill="#5b6b7c" text-anchor="middle">
<text x="105" y="244">start</text>
<text x="220" y="244">reader no.</text>
<text x="355" y="244">bytes that follow</text>
<text x="505" y="244">e.g. inventory,</text>
<text x="505" y="262">read, write, set AFI</text>
<text x="730" y="244">UID, block no., data</text>
<text x="950" y="244">XOR checksum</text>
<text x="1075" y="244">end</text>
</g>
<path d="M 160 285 V 295 H 1020 V 285" fill="none" stroke="#b86e00" stroke-width="1.5"/>
<text x="590" y="316" font-size="13.5" fill="#b86e00" font-weight="600" text-anchor="middle">BCC covers ADDR through DATA. A frame that fails the check is dropped and re-requested.</text>
<rect x="140" y="360" width="220" height="46" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="250" y="389" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="middle">Host PC</text>
<rect x="790" y="360" width="220" height="46" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.8"/>
<text x="900" y="389" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">Reader</text>
<g stroke="#d5dde6" stroke-width="1.6" stroke-dasharray="5 5">
<line x1="250" y1="406" x2="250" y2="720"/>
<line x1="900" y1="406" x2="900" y2="720"/>
</g>
<g stroke-width="1.8">
<line x1="256" y1="440" x2="894" y2="440" stroke="#1f3a5f" marker-end="url(#m0)"/>
<line x1="894" y1="490" x2="256" y2="490" stroke="#0b7a83" stroke-dasharray="6 4" marker-end="url(#m1)"/>
<line x1="256" y1="560" x2="894" y2="560" stroke="#1f3a5f" marker-end="url(#m0)"/>
<line x1="256" y1="630" x2="894" y2="630" stroke="#1f3a5f" marker-end="url(#m0)"/>
<line x1="894" y1="680" x2="256" y2="680" stroke="#0b7a83" stroke-dasharray="6 4" marker-end="url(#m1)"/>
</g>
<g font-size="13.5" font-weight="500" text-anchor="middle">
<text x="575" y="431">Command frame: STX ADDR LEN CMD DATA BCC ETX</text>
<text x="575" y="481">Response frame: status + data (UIDs, blocks)</text>
<text x="575" y="551">Command frame</text>
<text x="575" y="621">Same frame sent again (retry 1 of N)</text>
<text x="575" y="671">Response frame</text>
</g>
<rect x="150" y="578" width="220" height="30" rx="6" fill="#fbe9e7" stroke="#b3261e" stroke-width="1"/>
<text x="260" y="598" font-size="13" fill="#b3261e" font-weight="600" text-anchor="middle">No reply before timeout</text>
<g font-size="12.5" fill="#5b6b7c">
<text x="1020" y="450">Port settings</text>
<text x="1020" y="468">(baud, data bits,</text>
<text x="1020" y="486">parity) are set to</text>
<text x="1020" y="504">match the reader.</text>
</g>
<text x="1160" y="744" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
</svg>