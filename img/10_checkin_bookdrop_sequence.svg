<g font-size="13.5" font-weight="500">
<text x="152" y="180">Drops a book into the slot</text>
<text x="392" y="226">UID + item ID read in the chute</text>
<text x="632" y="272">SIP2 Checkin (09)</text>
<text x="632" y="318">Checkin response (10): ok, hold / transit flag</text>
<text x="392" y="364">Write AFI = 07h / set EAS (secure again)</text>
<text x="392" y="410">Write confirmed</text>
<text x="152" y="456">Light and screen: return accepted</text>
<text x="632" y="502">Route: shelf, hold shelf or transit bin</text>
</g>
<rect x="50" y="538" width="1100" height="32" rx="6" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.2"/>
<text x="600" y="559" font-size="13" fill="#b86e00" font-weight="600" text-anchor="middle">Unread tag or failed write: the item goes to an exception bin for a manual check.</text>
<text x="1160" y="624" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
