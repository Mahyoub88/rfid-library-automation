<g font-size="13.5" font-weight="500">
<text x="152" y="180">Scan library card, enter PIN</text>
<text x="344" y="226">Identify patron</text>
<text x="536" y="272">SIP2 Patron Information (63)</text>
<text x="536" y="318">Patron valid, no blocks (64)</text>
<text x="152" y="364">Place the stack of books on the pad</text>
<text x="536" y="410">Inventory request (STX … ETX)</text>
<text x="728" y="456">Inventory + read item-ID blocks</text>
<text x="728" y="502">UIDs + item IDs (all tags, one pass)</text>
<text x="536" y="548">Tag list</text>
<text x="536" y="594">SIP2 Checkout (11), one per item</text>
<text x="536" y="640">Checkout response (12): ok, due date</text>
<text x="536" y="686">Via reader: write AFI = C2h / clear EAS</text>
<text x="536" y="732">Write confirmed</text>
<text x="152" y="778">Receipt with titles and due dates</text>
</g>
<rect x="50" y="814" width="1100" height="32" rx="6" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.2"/>
<text x="600" y="835" font-size="13" fill="#b86e00" font-weight="600" text-anchor="middle">If any write or SIP2 reply fails, that item stays secured and the kiosk sends the patron to staff.</text>
<text x="1160" y="884" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, RFID Library Automation System (ISO/IEC 15693)</text>
</svg>